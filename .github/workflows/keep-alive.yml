name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 9:00 AM UTC — well under Supabase's 7-day pause window
    - cron: '0 9 */3 * *'
  workflow_dispatch: # lets you manually trigger it from the Actions tab to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep project active
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"